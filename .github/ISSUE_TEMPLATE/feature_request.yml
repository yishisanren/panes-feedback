name: Feature request
description: Something you would like Panes to add or improve
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: The situation you are in, and where Panes gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Panes to do?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and ROM
      placeholder: "Galaxy Z Fold6, One UI 8"
